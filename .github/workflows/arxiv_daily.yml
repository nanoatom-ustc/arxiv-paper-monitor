name: Daily Paper Digest

on:
  schedule:
    # 每天 UTC 1 点运行，即北京时间上午 9 点
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper digest
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

          FETCH_DAYS: ${{ vars.FETCH_DAYS || '2' }}
          MAX_RESULTS: ${{ vars.MAX_RESULTS || '20' }}
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS || 'tweezer array, integrated photonics, tweezer arrays, arno rauschenbeutel, integrated photonic, nanofiber, casimir polder, FPGA' }}
          SEARCH_SOURCES: ${{ vars.SEARCH_SOURCES || 'arxiv,aps' }}
          SEARCH_CATEGORIES: ${{ vars.SEARCH_CATEGORIES || '' }}
          APS_JOURNALS: ${{ vars.APS_JOURNALS || '' }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO || '' }}
        run: python main.py

